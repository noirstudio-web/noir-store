<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Términos y condiciones · NOIR STORE</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--card:#121216;--line:#24242b;--text:#e8eaee;--muted:#8b8f99;--accent:#d9dbe0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.7 Inter,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:18px 16px;border-bottom:1px solid var(--line);max-width:860px;margin:0 auto}
header img{height:30px}header nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid transparent}
header a.on,header a:hover{color:var(--text);border-color:var(--line);background:var(--card)}
main{max-width:860px;margin:0 auto;padding:28px 16px 70px}
h1{font:700 30px/1.2 Outfit,Inter,sans-serif;margin:0 0 6px}h2{font:600 19px/1.3 Outfit,Inter,sans-serif;margin:30px 0 8px;color:#fff}
.meta{color:var(--muted);font-size:13.5px;margin:0 0 22px}ul{padding-left:20px}li{margin:4px 0}b{color:#fff}
footer{max-width:860px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:22px}
.cards a{display:block;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);text-decoration:none}
.cards a:hover{border-color:#3a3a44}.cards b{display:block;font:600 18px Outfit,Inter,sans-serif;margin-bottom:4px}
</style>
</head>
<body>
<header><img src="../assets/logo-nav.png" alt="NOIR"><nav><a href="terminos.html" class="on">Términos</a><a href="privacidad.html" class="">Privacidad</a></nav></header>
<main id="doc"></main>
<footer>© NOIR Studio · NOIR STORE</footer>
<script src="../js/legal.js"></script>
<script>document.getElementById('doc').innerHTML = LEGAL.terms;</script>
</body>
</html>
